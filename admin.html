<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff0f5"><title>CMTI · 管理后台</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/overrides.css"></head><body><main class="admin-page"><header class="admin-header"><a class="brand" href="/"><span class="brand-mark">C</span><span><strong>CMTI</strong><small>竞赛人格探索</small></span></a><a href="/">返回测试首页</a></header><section id="loginPanel" class="admin-panel"><div class="eyebrow"><span class="eyebrow-line"></span>ADMINISTRATION</div><h2>学生结果</h2><p>输入学校配置的管理员密码，查看已同意提交的测试记录。数据仅此后台可见。</p><form id="loginForm"><label class="field-label" for="adminPassword">管理员密码</label><input id="adminPassword" type="password" autocomplete="current-password" required><button class="button button-primary button-wide" type="submit">登录后台</button><div class="admin-message" id="loginMessage"></div></form></section><section id="dashboard" class="hidden"><div class="module-heading" style="margin-top:34px"><div><div class="eyebrow"><span class="eyebrow-line"></span>STUDENT RESULTS</div><h1 style="font-size:32px;margin:10px 0 5px">测试记录</h1><p id="recordCount">已提交的学生画像</p></div><button id="logoutButton" class="button button-outline">退出登录</button></div><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>姓名</th><th>专业</th><th>主要人格</th><th>人格雷达图</th><th>提交时间</th><th>操作</th></tr></thead><tbody id="recordsBody"></tbody></table><div id="emptyState" class="admin-empty hidden">还没有学生提交测试结果。</div></div></section></main><script src="/admin.js" defer></script></body></html>
